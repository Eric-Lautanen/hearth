[workspace]
resolver = "2"
members = [
    "crates/hearth-core",
    "crates/hearth-gguf",
    "crates/hearth-quant",
    "crates/hearth-tokenizer",
    "crates/hearth-sampler",
    "crates/hearth-llm",
    "crates/hearth-compute",
    "crates/hearth-diffusion",
]

[workspace.dependencies]
half = { version = "2.6", features = ["bytemuck"] }
memmap2 = "0.9"
bytemuck = "1"

thiserror = "2"
rayon = "1.10"
wide = "1.3"
matrixmultiply = "0.3"
hearth-core = { path = "crates/hearth-core" }
hearth-gguf = { path = "crates/hearth-gguf" }
hearth-quant = { path = "crates/hearth-quant" }
hearth-tokenizer = { path = "crates/hearth-tokenizer" }
hearth-sampler = { path = "crates/hearth-sampler" }
hearth-llm = { path = "crates/hearth-llm" }
hearth-compute = { path = "crates/hearth-compute" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
