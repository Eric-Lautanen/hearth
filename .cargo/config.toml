[build]
# Portable baseline: every SIMD fast path in this repo is behind a runtime
# feature probe (is_x86_feature_detected + #[target_feature] callees), so the
# baseline only governs *autovectorized* code. x86-64-v2 (SSE4.2) runs anywhere
# from ~2011 on; AVX2/AVX-512 still dispatch at runtime where present.
# For a max-perf local build: RUSTFLAGS="-C target-cpu=native" cargo build --release
rustflags = ["-C", "target-cpu=x86-64-v2"]

