name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check (all)
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (lib crates)
        run: cargo test --workspace --exclude hearth-compute --exclude hearth-bench --exclude hearth-app -- --test-threads=1

  # The cheap, deterministic guard for the class of bug that cost 5.7x on the
  # 1.7B Q1_0 in one silent step: a runtime-dispatched SIMD kernel compiles to
  # per-instruction calls when the *crate baseline* lacks a feature the body
  # uses (`avx2` does not imply `fma`/`f16c`; the 256-bit EVEX VNNI form needs
  # `avx512vl` on top of `avx512vnni`). Build the kernels at a weak baseline and
  # fail on any out-of-line FMA/VNNI call, or any f16 conversion called from a
  # SIMD body -- that call is the regression, and the banner still says `avx2`.
  kernel-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Kernels must keep hardware FMA/F16C at a weak baseline
        shell: bash
        run: |
          set -euo pipefail
          # `--emit=asm=PATH` rather than a glob over the target directory: the artefact's name
          # is rustc's business, and when it stopped matching the glob this step failed with an
          # empty path (`FileNotFoundError: ''`) instead of reporting on a kernel. The listing
          # is the input to the check, so the workflow states where it goes.
          check() {
            local out="$1" dir="$2"
            shift 2
            RUSTFLAGS="-C target-cpu=x86-64-v2" cargo rustc -p hearth-quant --release "$@" \
              --target-dir "$dir" -- --emit=asm="$out"
            test -s "$out" || {
              echo "::error::rustc wrote no assembly listing to $out"
              return 1
            }
            python3 scripts/check-kernel-baseline.py "$out"
          }
          check target/baseline-lib.s target/baseline-asm --lib
          # The test build as well: a kernel only the tests reach is a kernel the library
          # build never sees, and the Q1_0_G128 VNNI kernel hid there -- `#[cfg(test)]`,
          # measuring +180% against the kernel it was meant to replace, so it was never
          # dispatched, so nothing ever re-measured it.
          check target/baseline-tests.s target/baseline-asm-tests --tests

  # aarch64 has no runner in this matrix, and does not need one to catch the kind
  # of break that stops a release: a reference to an x86-only module from a branch
  # the optimizer can prove dead is still a name the compiler has to resolve, so
  # `hearth-tls` did not build for aarch64 at all until its AES-NI and PCLMUL
  # calls were gated on the architecture. `cargo check` does not link, so this
  # runs on the x86 runners already here and still covers every target, clippy
  # included. The three targets are the platforms a release has to reach: ARM
  # Linux (Graviton, Raspberry Pi), Apple silicon, Windows on ARM.
  arm-cross-check:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - aarch64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          components: clippy

      - name: cargo check (${{ matrix.target }})
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

      - name: cargo clippy (${{ matrix.target }})
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

  # The cross-check proves aarch64 compiles; this proves it runs, which is the
  # half that matters for the kernels. aarch64 has no SIMD backend yet, so every
  # dispatched kernel there is the scalar fallback, and nothing had ever executed
  # that path on an ARM instruction set. The crates listed are the CPU-only ones:
  # the TLS/UI suites want sockets and a filesystem, and are covered natively.
  arm-qemu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Cross linker and user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # `qemu-user-static` stopped being a real package on ubuntu-latest (26.04): apt now
          # reports it as virtual, provided by `qemu-user-binfmt`. The emulator itself is the
          # same binary under either name, so try the packages that ship it and then find it
          # where that package put it, instead of naming one path that only one release has.
          installed=no
          for pkg in qemu-user qemu-user-static qemu-user-binfmt; do
            if sudo apt-get install -y "$pkg"; then
              echo "installed $pkg"
              installed=yes
              break
            fi
          done
          test "$installed" = yes || { echo "::error::no aarch64 emulator package would install"; exit 1; }
          qemu=$({ command -v qemu-aarch64-static || command -v qemu-aarch64 || \
                   find /usr -maxdepth 4 -name 'qemu-aarch64*' -type f; } 2>/dev/null | head -1)
          test -n "$qemu" || { echo "::error::installed qemu but found no aarch64 emulator"; exit 1; }
          echo "aarch64 emulator: $qemu"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=$qemu -L /usr/aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: cargo test under qemu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo test --target aarch64-unknown-linux-gnu \
            -p hearth-core -p hearth-gguf -p hearth-quant \
            -p hearth-tokenizer -p hearth-sampler -p hearth-llm \
            -- --test-threads=1
